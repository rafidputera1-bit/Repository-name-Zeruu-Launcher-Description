name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek dan terapkan kode v0.5.0
        run: |
          ZIP=$(ls zeruu-launcher-v*.zip | sort -V | tail -n1)
          echo "Mengambil aset dasar dari: $ZIP"
          unzip -o "$ZIP"
          if [ -f zeruu-launcher/app/build.gradle.kts ]; then
            cp -a zeruu-launcher/. .
          fi
          rm -f app/src/main/java/com/zeruu/launcher/ui/settings/CustomizeScreen.kt
          if [ -f zeruu-v5-files.txt ]; then
            python3 - << 'PY'
          import os, re
          with open("zeruu-v5-files.txt", "r", encoding="utf-8") as f:
              text = f.read().replace("\r\n", "\n")
          parts = re.split(r"^---\s*START OF FILE\s+(.+?)\s*---\s*$", text, flags=re.MULTILINE)
          count = 0
          for i in range(1, len(parts), 2):
              path = parts[i].strip()
              content = parts[i + 1].lstrip("\n")
              if not path or path.startswith(".github/"):
                  continue
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "w", encoding="utf-8", newline="\n") as out:
                  out.write(content)
              count += 1
          print(f"Berhasil menulis {count} file v0.5.0")
          assert count >= 30, f"Baru {count} file! Pastikan Blok 1, Blok 2, dan Blok 3 sudah ditempel semua."
          PY
          fi
          test -f app/src/main/java/com/zeruu/launcher/ui/clock/LivingClock.kt
      - name: Versi proyek
        id: ver
        run: |
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Versi proyek: $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Buat Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zeruu-launcher-${{ steps.ver.outputs.v }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
        
          
