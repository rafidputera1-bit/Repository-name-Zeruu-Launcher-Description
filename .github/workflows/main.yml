name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek dari ZIP terbaru
        run: |
          ls -la
          ZIP=$(ls zeruu-launcher-v*.zip | sort -V | tail -n1)
          echo "Memakai: $ZIP"
          unzip -o "$ZIP"
          if [ -f zeruu-launcher/app/build.gradle.kts ]; then
            cp -a zeruu-launcher/. .
          fi
          test -f app/src/main/java/com/zeruu/launcher/ui/clock/LivingClock.kt
      - name: Versi proyek
        id: ver
        run: |
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "Versi proyek: $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zeruu-launcher-${{ steps.ver.outputs.v }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
